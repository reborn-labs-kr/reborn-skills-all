# npm 발행 — provenance 를 붙여서 낸다.
#
# ★★왜 CI 에서 내나(2026-08-25 구매자 실사고).
#   손으로 `npm publish` 하면 npm 에 남는 건 "누가 올렸다"뿐이다. 그러면 검증하러 온 쪽에서는
#   패키지 안의 코드가 이 저장소의 그 코드인지 확인할 방법이 없다 — 그게 "no audit trail" 이다.
#   실제로 구매자의 클로드가 그 이유로 설치를 거부했다.
#
#   `--provenance` 는 이 워크플로가 **어느 커밋에서 무엇을 빌드했는지**를 서명해 붙인다.
#   그러면 npm 페이지에 초록색 provenance 배지가 뜨고, 소스 커밋으로 바로 이어진다.
#   사람이 읽어 안심하는 것보다 **기계가 검증할 수 있다**는 게 핵심이다.
#
# ★필요한 것 하나: 저장소 Secrets 에 `NPM_TOKEN`(Automation 토큰).
#   npmjs.com → Access Tokens → Generate New Token → **Automation** 으로 만든다.
#   Automation 토큰이어야 2FA 를 요구하지 않고 CI 에서 발행된다.
#
# ★버전이 이미 npm 에 있으면 발행하지 않고 조용히 끝낸다.
#   같은 버전 재발행은 npm 이 막는다 — 그걸 실패로 만들면 태그를 다시 못 민다.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # ← provenance 서명에 필요하다. 빼면 --provenance 가 실패한다.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # 설치기는 의존성이 없다. 그래도 자기시험은 돌린다 —
      # 깨진 것을 provenance 로 서명해 내보내면 서명이 문제를 덮어 준다.
      - name: 자기시험
        run: node install.mjs --self-test

      - name: 이미 나간 판인지 본다
        id: 확인
        run: |
          이름=$(node -p "require('./package.json').name")
          판=$(node -p "require('./package.json').version")
          if npm view "$이름@$판" version > /dev/null 2>&1; then
            echo "낼것=no" >> "$GITHUB_OUTPUT"
            echo "$이름@$판 은 이미 npm 에 있다. 건너뛴다."
          else
            echo "낼것=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 발행 (provenance 포함)
        if: steps.확인.outputs.낼것 == 'yes'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
